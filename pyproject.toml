[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-security-sentinel"
version = "1.1.0"
description = "Deterministic, privacy-first Git security scanner with 47 detection rules, false-positive suppression, and zero external runtime dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Ayush Kumar" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.scripts]
git-scan = "git_security_sentinel.cli:main"
git-security-sentinel = "git_security_sentinel.cli:main"
git-sentinel-ai = "git_security_sentinel.ai_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
git_security_sentinel = ["py.typed"]
