name: Publish Python Package to PyPI

on:
  # Publish only on tag pushes. A `release: published` trigger would re-run
  # this workflow from the tag commit (which predates workflow-only fixes),
  # creating a duplicate, red deployment for an already-published version.
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build Distribution Packages
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-packages
          path: dist/
          retention-days: 7

  pypi-publish:
    name: Publish to PyPI via Trusted Publishing
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/git-security-sentinel
    permissions:
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-packages
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Idempotent re-runs of a tag: already-published files are skipped
          # instead of failing the workflow.
          skip-existing: true
