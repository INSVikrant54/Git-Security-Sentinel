name: Security Scan and Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Run Unit Tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 is not available on ubuntu-latest (26.04); pin to 22.04.
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.10"
            os: ubuntu-latest
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
          # Windows coverage for the subprocess/encoding paths.
          - python-version: "3.11"
            os: windows-latest
          - python-version: "3.13"
            os: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify zero third-party dependencies & compile scripts
        run: |
          python -m py_compile scripts/scan_diff.py scripts/ai_review.py tests/test_scan_diff.py

      - name: Run unit test suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  diff-security-scan:
    name: PR Diff Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: test

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate SARIF Security Report
        run: |
          python scripts/scan_diff.py --base origin/${{ github.base_ref }} --format sarif --output results.sarif
        continue-on-error: true

      - name: Upload SARIF report to GitHub Advanced Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

      - name: Run Git Security Sentinel against base branch
        run: |
          python scripts/scan_diff.py --base "${{ github.event.pull_request.base.ref }}" --severity-threshold high
